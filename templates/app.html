<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drone Control Dashboard</title>
</head>
<body>
    <header>
        <h1>Halo, Welcome Rimuru!</h1>
        <nav>
            <a href="/get_all_params">Get All Params</a> | 
            <a href="/plane_status">Status</a>
        </nav>
    </header>

    <hr>

    <section id="mission-control">
        <h3>Mission Planning</h3>
        <form action="/wp" method="post">
            <button type="submit">Generate WP</button>
        </form>
    </section>

    <hr>

    <section id="vehicle-status">
        <div id="arm-control">
            <p><strong>Vehicle Status:</strong> {{ "Armed" if arm else "Disarmed" }}</p>
            <form action="/arm" method="post">
                <button type="submit">{{ "Disarm" if arm else "Arm" }}</button>
            </form>
            <p><strong>Vehicle Mode:</strong> {{ mode }}</p>
            <form action="/switch" method="post">
                <button type="submit">Switch</button>
            </form>
        </div>
    </section>

    <hr>

    <section id="parameters">
        <h3>Parameter List</h3>
        <form action="/" method="post">
            <fieldset>
                <legend>Takeoff Settings</legend>
                
                <div>
                    <label for="param1">Min Acc:</label>
                    <input type="text" id="param1" name="min_acc" value="{{ param1 if param1 != None else '' }}">
                </div>
                
                <br>
                <button type="submit">Update Parameters</button>
            </fieldset>
        </form>
    </section>

</body>
</html>
